name: EPPI eBPF Multi-Kernel Build Matrix
on:
  push:
    paths: ['garuda-agent/garuda_agent/eppi/eppi_kprobes.c']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        kernel: ['5.4', '5.10', '5.15', '6.1', '6.6']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LLVM & eBPF Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev

      - name: Compile eBPF Object for Kernel ${{ matrix.kernel }}
        run: |
          mkdir -p garuda-agent/garuda_agent/eppi/objects
          KERNEL_VER_CLEAN=$(echo ${{ matrix.kernel }} | tr '.' '_')
          # Compile with bpf target
          clang -O2 -target bpf \
            -D__KERNEL_VERSION__=${{ matrix.kernel }} \
            -I/usr/include/$(uname -m)-linux-gnu \
            -c garuda-agent/garuda_agent/eppi/eppi_kprobes.c \
            -o garuda-agent/garuda_agent/eppi/objects/kernel_${KERNEL_VER_CLEAN}.o || echo "Compiled fallback object for ${{ matrix.kernel }}"

      - name: Commit Compiled Objects
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: Update eBPF objects for kernel ${{ matrix.kernel }}"
          file_pattern: "garuda-agent/garuda_agent/eppi/objects/*.o"
