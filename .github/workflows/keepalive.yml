name: Keepalive — 24/7 Warm Pinger

on:
  schedule:
    - cron: "*/14 * * * *"   # Every 14 minutes — keeps Render.com free tier services and Vercel warm
  workflow_dispatch:

jobs:
  ping:
    name: Ping Production Endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health + critical endpoints
        run: |
          BASE="https://garuda-intel.vercel.app"
          fail=0

          ping_endpoint() {
            local url="$1"
            local label="$2"
            local extra="$3"
            status=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 15 $extra "$url")
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "✅ $label → $status"
            else
              echo "❌ $label → $status"
              fail=1
            fi
          }

          ping_endpoint "$BASE/api/health" "Health"
          ping_endpoint "$BASE/api/taxii2/" "TAXII" '-H "Accept: application/taxii+json;version=2.1"'
          ping_endpoint "$BASE/api/alerts" "Alerts"
          ping_endpoint "$BASE/api/easm/findings" "EASM"
          ping_endpoint "$BASE/api/rpz/entries" "RPZ"
          ping_endpoint "$BASE/api/attribution/clusters" "Attribution"
          ping_endpoint "$BASE/api/pdns/matches" "PDNS"

          # Render.com & Microservices Keepalive
          AXIOM_URL="${RENDER_AXIOM_URL:-https://garuda-axiom-service.onrender.com}"
          ping_endpoint "$AXIOM_URL/health" "AXIOM-Render-1"

          if [ -n "$RENDER_BRAHMA_URL" ] || [ -n "$NORTHFLANK_BRAHMA_URL" ]; then
            BRAHMA_URL="${RENDER_BRAHMA_URL:-$NORTHFLANK_BRAHMA_URL}"
            ping_endpoint "$BRAHMA_URL/health" "BRAHMA-Service-2"
          fi
          if [ -n "$KOYEB_UTNE_URL" ]; then
            ping_endpoint "$KOYEB_UTNE_URL/health" "UTNE-Koyeb"
          fi


          exit $fail

