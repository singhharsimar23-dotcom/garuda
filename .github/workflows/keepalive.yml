name: Keepalive

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday 09:00 UTC (prevents GitHub Actions dormancy)
  workflow_dispatch:

jobs:
  keepalive:
    name: Touch Keepalive Timestamp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Timestamp
        run: |
          echo $(date -u +"%Y-%m-%dT%H:%M:%SZ") > .keepalive
          git config user.email "garuda-bot@garuda.in"
          git config user.name "GARUDA Bot"
          git add .keepalive
          git commit -m "keepalive: $(date -u +%Y-%m-%d)" || exit 0
          git push
