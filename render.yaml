services:
  # Service 1: AXIOM-II Physics Layer Ingestion Engine
  - type: web
    name: garuda-axiom-service
    runtime: docker
    dockerfilePath: ./axiom-service/Dockerfile
    dockerContext: ./axiom-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: INTER_SERVICE_SECRET
        sync: false
      - key: BRAHMA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: DHARMA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: SENTINEL_SERVICE_URL
        value: https://garuda-sentinel-service.onrender.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Service 2: BRAHMA Adversary, KALI Red-Team & DHARMA Autonomous Response Engine
  - type: web
    name: garuda-brahma-service
    runtime: docker
    dockerfilePath: ./brahma-service/Dockerfile
    dockerContext: ./brahma-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTER_SERVICE_SECRET
        sync: false
      - key: AXIOM_SERVICE_URL
        value: https://garuda-axiom-service.onrender.com
      - key: SENTINEL_SERVICE_URL
        value: https://garuda-sentinel-service.onrender.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: DHARMA_SSH_HOST
        sync: false
      - key: DHARMA_SSH_USER
        sync: false
      - key: DHARMA_SSH_KEY
        sync: false
      - key: KALI_MCTS_SIMULATIONS
        value: "500"

  # Service 3: UTNE Executive Threat Narrative Engine
  - type: web
    name: garuda-utne-service
    runtime: docker
    dockerfilePath: ./network-service/Dockerfile
    dockerContext: ./network-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_PREFERRED_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: BRAHMA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: AXIOM_SERVICE_URL
        value: https://garuda-axiom-service.onrender.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # Service 4: SENTINEL Autonomous Agent Brain Engine
  - type: web
    name: garuda-sentinel-service
    runtime: docker
    dockerfilePath: ./sentinel-service/Dockerfile
    dockerContext: ./sentinel-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTER_SERVICE_SECRET
        sync: false
      - key: AXIOM_SERVICE_URL
        value: https://garuda-axiom-service.onrender.com
      - key: BRAHMA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: DHARMA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: MAYA_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: KALI_SERVICE_URL
        value: https://garuda-brahma-service.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CONFLICT_MODE
        value: "false"
